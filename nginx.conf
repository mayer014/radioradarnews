worker_processes 1;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;

        root /usr/share/nginx/html;
        index index.html;

        # HTML files - NEVER cache (always fetch latest)
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri /index.html;
        }

        # Service Worker - NEVER cache
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # env.js - NEVER cache (runtime config)
        location = /env.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # manifest.json - short cache
        location = /manifest.json {
            add_header Cache-Control "no-cache";
        }

        # Vite hashed assets (JS/CSS with hash in filename) - cache forever
        location ~* /assets/.*\.(js|css)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Images and fonts - cache 30 days
        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
            add_header Cache-Control "public, max-age=2592000";
        }

        # Default fallback to SPA
        location / {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri /index.html;
        }
    }
}
